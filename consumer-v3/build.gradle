plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories { mavenCentral() }

dependencies {
    implementation 'com.rabbitmq:amqp-client:5.20.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'

    // NEW for Assignment 3
    implementation 'mysql:mysql-connector-java:8.0.33'       // MySQL JDBC driver
    implementation 'com.zaxxer:HikariCP:5.1.0'               // Connection pool
    implementation 'com.sun.net.httpserver:http:20070405'     // Metrics API (built-in JDK)
}

application {
    mainClass = 'consumer.ConsumerMain'
}

jar {
    manifest { attributes 'Main-Class': 'consumer.ConsumerMain' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}